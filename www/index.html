<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Streaming</title>
    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>
    <div class="container">
        <header>
            <h1>VPN Streaming <span class="version">v5.0.1</span></h1>
            <div class="header-right">
                <div id="status-indicator" class="status-indicator">
                    <span class="dot"></span>
                    <span id="status-text">-</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Streaming Devices -->
            <section class="card">
                <div class="card-header">
                    <h2>Streaming Devices</h2>
                    <button class="btn btn-small" onclick="showAddDeviceModal()">+ Device</button>
                </div>

                <div id="devices-container" class="devices-grid">
                    <!-- Dynamisch gefüllt -->
                    <div class="device-card placeholder">
                        <p>Keine Devices konfiguriert</p>
                        <button class="btn" onclick="showAddDeviceModal()">Device hinzufügen</button>
                    </div>
                </div>
            </section>

            <!-- Aktive Tunnel -->
            <section class="card">
                <div class="card-header">
                    <h2>Aktive Tunnel</h2>
                    <span id="tunnel-count" class="badge">0</span>
                </div>

                <div id="tunnels-container" class="tunnels-list">
                    <div class="info">Keine aktiven Tunnel</div>
                </div>
            </section>

            <!-- Global Controls -->
            <section class="card">
                <h2>Steuerung</h2>
                <div class="control-row">
                    <button class="btn" onclick="enableAllDevices()">Alle An</button>
                    <button class="btn btn-secondary" onclick="disableAllDevices()">Alle Aus</button>
                    <button class="btn btn-secondary" onclick="showCredentialsModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        Passw&ouml;rter
                    </button>
                </div>
            </section>

            <!-- Verfügbare Tunnel -->
            <section class="card collapsed">
                <h2 class="collapsible" onclick="toggleSection(this)">
                    Verfügbare Tunnel
                    <span id="available-tunnel-count" class="badge">0</span>
                </h2>
                <div class="collapsible-content">
                    <div id="available-tunnels" class="tunnels-grid">
                        <!-- Dynamisch gefüllt -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Add Device Modal -->
    <div id="add-device-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>Device hinzufügen</h3>
                <button class="btn-close" onclick="closeModal('add-device-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>IP-Adresse:</label>
                    <input type="text" id="new-device-ip" placeholder="192.168.x.x">
                </div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="new-device-name" placeholder="FireTV Wohnzimmer">
                </div>
                <div class="form-group">
                    <label>Tunnel:</label>
                    <select id="new-device-tunnel">
                        <option value="">-- Tunnel wählen --</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('add-device-modal')">Abbrechen</button>
                <button class="btn btn-primary" onclick="addDevice()">Hinzufügen</button>
            </div>
        </div>
    </div>

    <!-- Edit Device Modal -->
    <div id="edit-device-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>Device bearbeiten</h3>
                <button class="btn-close" onclick="closeModal('edit-device-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-device-ip">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="edit-device-name">
                </div>
                <div class="form-group">
                    <label>Tunnel:</label>
                    <select id="edit-device-tunnel">
                        <option value="">-- Kein Tunnel --</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteDevice()">Löschen</button>
                <button class="btn btn-secondary" onclick="closeModal('edit-device-modal')">Abbrechen</button>
                <button class="btn btn-primary" onclick="saveDevice()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal modal-small">
            <div class="modal-header">
                <h3 id="confirm-title">Bestätigung</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-message">Sind Sie sicher?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('confirm-modal')">Abbrechen</button>
                <button class="btn btn-danger" id="confirm-btn">Bestätigen</button>
            </div>
        </div>
    </div>

    <!-- Credentials Modal -->
    <div id="credentials-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>VPN Zugangsdaten</h3>
                <button class="btn-close" onclick="closeModal('credentials-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="credentials-container">
                    <div class="info">Lade Provider...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('credentials-modal')">Schliessen</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=5.3"></script>
</body>
</html>
